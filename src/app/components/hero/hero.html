<section class="hero">
  <!-- GRID -->
  <div class="blueprint-grid"></div>

  <div class="ambient"></div>

  <div class="hero-content">
    <div class="eyebrow reveal">
      CREATIVE DEVELOPER
      <span> / </span>
      INDUSTRIAL DESIGNER
    </div>

    <h1 class="title">
      <span class="line"> Solving creative </span>

      <span class="line"> problems. </span>

      <span class="line muted"> Crafting technical </span>

      <span class="line muted"> solutions. </span>
    </h1>

    <p class="subtitle reveal">
      Building digital products with physical thinking.

      <br />

      Thoughtful interfaces, playful interactions, scalable systems.
    </p>

    <div class="stack reveal">
      <span>Angular</span>
      <span>TypeScript</span>
      <span>Node</span>
      <span>Creative Coding</span>
    </div>
  </div>

  <div class="hero-object">
    <div class="halo"></div>

    <app-model3d
      class="model"
      model="assets/models/donut.glb"
      [scale]="9"
      [rotY]="1.6"
      [rotX]="0.2"
      [rotZ]="0"
    >
    </app-model3d>

    <div class="lines">
      <img src="/assets/images/lines/dontuto.png" />
    </div>
  </div>

  <!-- DECOR ELEMENTS -->
  <div class="orbit orbit-one layer-slow"></div>
  <div class="orbit orbit-two layer-fast"></div>
  <div class="spec-card layer-slow">
    <span>DONUT_01</span> <span>3D / INTERACTION</span> <span>2026</span>
  </div>
</section>
